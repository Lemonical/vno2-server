services:
  community:
    image: vno2-server:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      Community__Id: ${COMMUNITY_ID:?Set the registered community ID}
      Community__Name: ${COMMUNITY_NAME:-VNO2 Community}
      Community__MasterBaseUrl: ${MASTER_BASE_URL:?Set the trusted HTTPS master base URL}
      Community__ServerCredential: ${SERVER_CREDENTIAL:?Set the registered server credential}
    volumes:
      - community-data:/data
    restart: unless-stopped
volumes:
  community-data:
